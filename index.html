<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Sophia: AI Chess Tutor & Stockfish Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1;
            width: 100%;
            max-width: 600px;
            border: 4px solid #262522;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease;
        }
        .light-square { background-color: #ebecd0; color: #779556; }
        .dark-square { background-color: #779556; color: #ebecd0; }
        .square.selected { background-color: rgba(247, 247, 105, 0.6) !important; }
        .square.highlighted::after {
            content: '';
            width: 24%;
            height: 24%;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            position: absolute;
        }
        .square.highlighted.has-piece::after {
            width: 90%;
            height: 90%;
            background-color: transparent;
            border: 4px solid rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }
        .piece {
            width: 90%;
            height: 90%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            transition: transform 0.1s ease;
        }
        .piece:active { transform: scale(1.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #262522; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #45433f; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#161512] text-[#f1f1f1] min-h-screen flex flex-col">

    <header class="bg-[#262522] border-b border-[#312e2b] px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-chess-knight text-3xl text-[#81b64c]"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Grandmaster Sophia</h1>
                <p class="text-xs text-[#bababa]">Interactive Stockfish AI Chess Coach</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-[#161512] px-3 py-1.5 rounded border border-[#312e2b]">
                <label for="apiKey" class="text-xs font-medium text-[#bababa]">API Key:</label>
                <input type="password" id="apiKey" placeholder="Paste Gemini Key..." class="bg-transparent text-xs text-white focus:outline-none w-40">
            </div>
            <button id="resetAppBtn" class="bg-rose-700/80 hover:bg-rose-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition shadow">
                <i class="fa-solid fa-rotate-left mr-1"></i> Reset Engine
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-3 flex flex-col space-y-4">
            <div class="bg-[#262522] rounded-lg p-4 border border-[#312e2b] shadow-sm">
                <h2 class="text-sm font-bold uppercase tracking-wider text-[#bababa] mb-3"><i class="fa-solid fa-graduation-cap mr-1.5 text-[#81b64c]"></i> Training Mode</h2>
                <div class="space-y-2" id="moduleTabs">
                    <button data-module="freeplay" class="w-full text-left bg-[#312e2b] hover:bg-[#3d3a35] border-l-4 border-[#81b64c] p-3 rounded text-sm font-medium transition flex items-center justify-between">
                        <span>vs Stockfish Engine</span>
                        <i class="fa-solid fa-robot text-xs text-[#81b64c]"></i>
                    </button>
                    <button data-module="openings" class="w-full text-left bg-[#21201d] hover:bg-[#3d3a35] border-l-4 border-transparent p-3 rounded text-sm font-medium transition flex items-center justify-between opacity-70 hover:opacity-100">
                        <span>Opening Masterclass</span>
                        <i class="fa-solid fa-book-open text-xs"></i>
                    </button>
                    <button data-module="midgame" class="w-full text-left bg-[#21201d] hover:bg-[#3d3a35] border-l-4 border-transparent p-3 rounded text-sm font-medium transition flex items-center justify-between opacity-70 hover:opacity-100">
                        <span>Midgame Strategy Planner</span>
                        <i class="fa-solid fa-chess-rook text-xs"></i>
                    </button>
                    <button data-module="puzzles" class="w-full text-left bg-[#21201d] hover:bg-[#3d3a35] border-l-4 border-transparent p-3 rounded text-sm font-medium transition flex items-center justify-between opacity-70 hover:opacity-100">
                        <span>Tactics & Puzzles Lab</span>
                        <i class="fa-solid fa-puzzle-piece text-xs"></i>
                    </button>
                </div>

                <div class="mt-4 pt-4 border-t border-[#312e2b]">
                    <div class="flex justify-between items-center mb-1">
                        <label for="difficultySlider" class="text-xs font-semibold text-[#bababa]">Stockfish Level:</label>
                        <span id="difficultyVal" class="text-xs font-bold text-[#81b64c]">Level 5</span>
                    </div>
                    <input type="range" id="difficultySlider" min="1" max="20" value="5" class="w-full accent-[#81b64c] bg-[#161512] h-1.5 rounded-lg cursor-pointer">
                </div>
            </div>

            <div id="contextPanel" class="bg-[#262522] rounded-lg p-4 border border-[#312e2b] flex-1 flex flex-col min-h-[200px]">
                </div>
        </section>

        <section class="lg:col-span-5 flex flex-col items-center justify-center space-y-4">
            <div class="w-full flex justify-between items-center px-1 text-sm font-medium text-[#bababa]">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-white rounded-sm border border-black"></div>
                    <span>Stockfish Engine (Black)</span>
                </div>
                <div id="engineStatus" class="text-xs font-mono text-amber-500 italic">Ready</div>
            </div>

            <div class="w-full flex space-x-3 items-stretch">
                <div class="w-5 bg-[#21201d] rounded overflow-hidden flex flex-col border border-[#312e2b] relative">
                    <div id="evalBlack" class="bg-[#111] w-full transition-all duration-300" style="height: 50%;"></div>
                    <div id="evalWhite" class="bg-[#fff] w-full flex-1 transition-all duration-300"></div>
                    <div class="absolute inset-0 flex flex-col justify-between items-center text-[10px] font-bold mix-blend-difference text-white py-1 pointer-events-none">
                        <span>+M</span>
                        <span>0.0</span>
                        <span>-M</span>
                    </div>
                </div>
                
                <div id="board" class="chessboard flex-1"></div>
            </div>

            <div class="w-full flex justify-between items-center px-1 text-sm font-medium text-[#bababa]">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-[#779556] rounded-sm"></div>
                    <span>You (White)</span>
                </div>
            </div>
        </section>

        <section class="lg:col-span-4 flex flex-col space-y-4">
            <div class="bg-[#262522] rounded-lg border border-[#312e2b] p-4 flex flex-col flex-1 min-h-[350px] shadow-sm">
                <div class="flex items-center justify-between border-b border-[#312e2b] pb-3 mb-3">
                    <div class="flex items-center space-x-2.5">
                        <div class="relative">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#81b64c] to-emerald-400 flex items-center justify-center font-bold text-white shadow">
                                SP
                            </div>
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#262522] rounded-full"></span>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-white">GM Sophia</h3>
                            <p
